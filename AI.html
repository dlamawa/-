<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome AI · 计算优先</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: #202123;
            color: #ececec;
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            flex-shrink: 0;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .sidebar .logo .icon {
            font-size: 28px;
        }
        .sidebar .new-chat {
            background: #2c2d31;
            border: 1px solid #3e3f44;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar .new-chat:hover {
            background: #3e3f44;
        }
        .sidebar .history {
            margin-top: 20px;
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            color: #ababab;
        }
        .sidebar .history .item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar .history .item:hover {
            background: #2c2d31;
            color: #fff;
        }
        .sidebar .footer {
            font-size: 12px;
            color: #5e5f64;
            border-top: 1px solid #2c2d31;
            padding-top: 12px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
        }
        .sidebar .footer .badge {
            background: #2c2d31;
            padding: 2px 10px;
            border-radius: 12px;
            color: #ececec;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .header {
            padding: 12px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            flex-shrink: 0;
        }
        .header .title {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .status {
            font-size: 13px;
            color: #6e6f74;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }
        .header .status .dot.searching {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 10px 24px;
            background: #ffffff;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.ai {
            justify-content: flex-start;
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.ai .avatar {
            background: #4a3728;
            color: #fff;
            margin-right: 12px;
        }
        .message.user .avatar {
            display: none;
        }

        .message .bubble {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user .bubble {
            background: #3b82f6;
            color: #fff;
        }
        .message.ai .bubble {
            background: #f0f0f2;
            color: #1a1a1a;
        }

        .message .bubble .thinking {
            color: #8e8e93;
            font-style: italic;
            font-size: 14px;
        }
        .message .bubble .error {
            color: #dc2626;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8e8e93;
            text-align: center;
            padding: 40px;
        }
        .welcome .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .welcome h2 {
            font-weight: 500;
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .welcome p {
            font-size: 15px;
            max-width: 380px;
            color: #8e8e93;
        }

        .input-area {
            padding: 12px 24px 24px 24px;
            border-top: 1px solid #e5e5e5;
            background: #ffffff;
            flex-shrink: 0;
        }
        .input-area .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: #f7f7f8;
            border-radius: 24px;
            padding: 4px 4px 4px 20px;
            border: 1px solid #e5e5e5;
            transition: border-color 0.2s;
        }
        .input-area .input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .input-area textarea {
            flex: 1;
            resize: none;
            border: none;
            padding: 12px 0;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            min-height: 28px;
            max-height: 160px;
            line-height: 1.6;
            background: transparent;
            color: #1a1a1a;
        }
        .input-area textarea::placeholder {
            color: #9ca3af;
        }
        .input-area .send-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .input-area .send-btn:hover {
            background: #2563eb;
        }
        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-area .input-tips {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px 0 12px;
            font-size: 12px;
            color: #9ca3af;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #c1c1c6;
            border-radius: 10px;
        }
        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #a8a8ad;
        }

        @media (max-width: 640px) {
            .sidebar {
                display: none;
            }
            .chat-area {
                padding: 16px 16px 10px 16px;
            }
            .input-area {
                padding: 8px 16px 16px 16px;
            }
            .input-area .input-wrapper {
                padding-left: 16px;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <span class="icon">🐻</span>
            <span>Welcome AI</span>
        </div>
        <div class="new-chat" id="newChatBtn">✨ 新对话</div>
        <div class="history" id="historyList">
            <div class="item" style="color:#6e6f74;cursor:default;">暂无历史</div>
        </div>
        <div class="footer">
            <span>v3.3 · 计算优先</span>
            <span class="badge" id="ruleBadge">0 条知识</span>
        </div>
    </aside>

    <div class="main">
        <div class="header">
            <div class="title">
                <span>🐻</span>
                <span>Welcome AI</span>
            </div>
            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusLabel">就绪</span>
                <span style="color:#9ca3af;font-size:12px;">|</span>
                <span id="modeLabel" style="font-size:12px;">🧮 计算优先</span>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome" id="welcomePlaceholder">
                <div class="icon">🐻</div>
                <h2>Welcome AI</h2>
                <p>我能算、能学、能上网</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="inputBox" rows="1" placeholder="输入问题…"></textarea>
                <button class="send-btn" id="sendBtn">发送</button>
            </div>
            <div class="input-tips">
                <span>Enter 发送 · Shift+Enter 换行</span>
                <span id="memoryCount">🧠 0 条知识</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // Welcome AI · 计算优先
            // 能用JS算的绝不绕弯
            // ============================================================

            const SEARCH_API = 'https://fingerdog50-ai-first-search.hf.space/search';

            // ---------- 状态 ----------
            let rules = [];
            let facts = [];
            let webKnowledge = [];
            let isProcessing = false;
            let historyItems = [];
            let messageCount = 0;

            // DOM
            const chatArea = document.getElementById('chatArea');
            const welcome = document.getElementById('welcomePlaceholder');
            const inputBox = document.getElementById('inputBox');
            const sendBtn = document.getElementById('sendBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const historyList = document.getElementById('historyList');
            const statusLabel = document.getElementById('statusLabel');
            const statusDot = document.getElementById('statusDot');
            const modeLabel = document.getElementById('modeLabel');
            const ruleBadge = document.getElementById('ruleBadge');
            const memoryCount = document.getElementById('memoryCount');

            // ---------- 核心：直接计算 ----------
            function calculate(expr) {
                // 清理表达式：支持中文符号
                let cleaned = expr
                    .replace(/[＝=]/g, '=')
                    .replace(/[×*]/g, '*')
                    .replace(/[÷/]/g, '/')
                    .replace(/[＋+]/g, '+')
                    .replace(/[－-]/g, '-');

                // 提取算式部分（只取数字和运算符）
                const match = cleaned.match(/([\d.]+)\s*([+\-*/])\s*([\d.]+)/);
                if (!match) return null;

                const a = parseFloat(match[1]);
                const op = match[2];
                const b = parseFloat(match[3]);

                if (isNaN(a) || isNaN(b)) return null;

                let result;
                switch (op) {
                    case '+':
                        result = a + b;
                        break;
                    case '-':
                        result = a - b;
                        break;
                    case '*':
                        result = a * b;
                        break;
                    case '/':
                        if (b === 0) return '除数不能为0';
                        result = a / b;
                        break;
                    default:
                        return null;
                }

                // 格式化结果（小数保留2位）
                const formatted = Number.isInteger(result) ? result : result.toFixed(2);
                return `${a} ${op} ${b} = ${formatted}`;
            }

            // ---------- 解析输入 ----------
            function parseInput(text) {
                const trimmed = text.trim();

                // 规则命令
                if (trimmed.startsWith('规则：') || trimmed.startsWith('规则:')) {
                    const content = trimmed.replace(/^规则[：:]/, '').trim();
                    return { type: 'rule', content };
                }

                // 检测是否含算式
                if (trimmed.match(/[\d.]+\s*[+\-*/]\s*[\d.]+/)) {
                    return { type: 'math', question: trimmed };
                }

                return { type: 'question', question: trimmed };
            }

            // ---------- 学习规则 ----------
            function learnRule(text) {
                const lines = text.split('\n').filter(s => s.trim());
                let learned = 0;

                for (const line of lines) {
                    const trimmed = line.trim();
                    let added = false;

                    if (trimmed.includes('加法') || trimmed.includes('+')) {
                        const match = trimmed.match(/(\d+)\s*\+\s*(\d+)\s*=\s*(\d+)/);
                        if (match) {
                            facts.push({ type: 'addition', a: parseInt(match[1]), b: parseInt(match[2]), result: parseInt(
                                    match[3]) });
                            learned++;
                            added = true;
                        } else if (!rules.some(r => r.type === 'addition')) {
                            rules.push({ type: 'addition', description: trimmed });
                            learned++;
                            added = true;
                        }
                    }

                    if (trimmed.includes('减法') || trimmed.includes('-')) {
                        const match = trimmed.match(/(\d+)\s*-\s*(\d+)\s*=\s*(\d+)/);
                        if (match) {
                            facts.push({ type: 'subtraction', a: parseInt(match[1]), b: parseInt(match[2]), result: parseInt(
                                    match[3]) });
                            learned++;
                            added = true;
                        } else if (!rules.some(r => r.type === 'subtraction')) {
                            rules.push({ type: 'subtraction', description: trimmed });
                            learned++;
                            added = true;
                        }
                    }

                    if (trimmed.includes('乘法') || trimmed.includes('×') || trimmed.includes('*')) {
                        const match = trimmed.match(/(\d+)\s*[×*]\s*(\d+)\s*=\s*(\d+)/);
                        if (match) {
                            facts.push({ type: 'multiplication', a: parseInt(match[1]), b: parseInt(match[2]), result: parseInt(
                                    match[3]) });
                            learned++;
                            added = true;
                        } else if (!rules.some(r => r.type === 'multiplication')) {
                            rules.push({ type: 'multiplication', description: trimmed });
                            learned++;
                            added = true;
                        }
                    }

                    if (trimmed.includes('除法') || trimmed.includes('÷') || trimmed.includes('/')) {
                        const match = trimmed.match(/(\d+)\s*[÷/]\s*(\d+)\s*=\s*(\d+)/);
                        if (match) {
                            facts.push({ type: 'division', a: parseInt(match[1]), b: parseInt(match[2]), result: parseInt(
                                    match[3]) });
                            learned++;
                            added = true;
                        } else if (!rules.some(r => r.type === 'division')) {
                            rules.push({ type: 'division', description: trimmed });
                            learned++;
                            added = true;
                        }
                    }

                    if (!added && trimmed.includes('规则')) {
                        rules.push({ type: 'general', description: trimmed });
                        learned++;
                    }
                }

                updateStats();
                return learned;
            }

            // ---------- 推理（知识检索） ----------
            function reason(question) {
                const allKnowledge = [
                    ...facts.map(f => `${f.type}: ${f.a} ${f.b} ${f.result}`),
                    ...rules.map(r => r.description),
                    ...webKnowledge
                ];

                if (allKnowledge.length === 0) return null;

                const keywords = question.replace(/[？，,、。！！\s]/g, '').split('');
                let bestMatch = null;
                let bestScore = 0;

                for (const item of allKnowledge) {
                    let score = 0;
                    for (const kw of keywords) {
                        if (item.includes(kw)) score += 1;
                    }
                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = item;
                    }
                }

                if (bestMatch && bestScore >= 2) {
                    return `根据我学到的：\n${bestMatch}`;
                }

                return null;
            }

            // ---------- 上网搜索 ----------
            async function searchWeb(query) {
                setStatus('正在上网查...', true);
                modeLabel.textContent = '🌐 搜索中';

                try {
                    const url = `${SEARCH_API}?q=${encodeURIComponent(query)}&k=5&max_tokens=800`;
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                    const data = await resp.json();
                    const results = data.results || [];

                    if (results.length === 0) {
                        setStatus('就绪', false);
                        modeLabel.textContent = '🧠 推理';
                        return '我没有找到相关内容，换个问法试试。';
                    }

                    let answer = '🌐 我上网查了一下：\n\n';
                    let count = 0;

                    for (const item of results) {
                        if (!item.ok) continue;
                        const title = item.title || '无标题';
                        const markdown = item.markdown || '';
                        const url2 = item.url || '';

                        if (markdown.length > 20) {
                            const chunks = chunkText(markdown, 300);
                            for (const c of chunks) {
                                if (c.length > 15 && !webKnowledge.includes(c)) {
                                    webKnowledge.push(c);
                                    count++;
                                }
                            }
                            if (title && !webKnowledge.includes(`📌 ${title}`)) {
                                webKnowledge.push(`📌 ${title}`);
                            }
                        }

                        answer += `📄 ${title}\n`;
                        answer += `   ${markdown.substring(0, 150)}${markdown.length > 150 ? '…' : ''}\n`;
                        if (url2) answer += `   🔗 ${url2}\n`;
                        answer += '\n';
                    }

                    updateStats();
                    setStatus('就绪', false);
                    modeLabel.textContent = '🧠 推理';
                    return answer + `\n✅ 已学习 ${count} 条新知识`;

                } catch (e) {
                    setStatus('搜索失败', false);
                    modeLabel.textContent = '🧠 推理';
                    return `上网搜索失败了：${e.message}`;
                }
            }

            function chunkText(text, size = 300) {
                const sentences = text.replace(/\n/g, '。').split(/[。！？\n]/).filter(s => s.trim().length > 0);
                const chunks = [];
                let current = '';
                for (const s of sentences) {
                    if (current.length + s.length < size) {
                        current += s + '。';
                    } else {
                        if (current) chunks.push(current.trim());
                        current = s + '。';
                    }
                }
                if (current) chunks.push(current.trim());
                return chunks;
            }

            // ---------- 辅助 ----------
            function setStatus(text, isSearching = false) {
                statusLabel.textContent = text;
                statusDot.className = 'dot' + (isSearching ? ' searching' : '');
            }

            // ---------- 处理输入 ----------
            async function processInput(text) {
                if (!text.trim() || isProcessing) return;

                const parsed = parseInput(text);
                addMessage('user', text);

                // 规则模式
                if (parsed.type === 'rule') {
                    const count = learnRule(parsed.content);
                    const response = count > 0 ?
                        `✅ 学会了 ${count} 条规则/事实！` :
                        '⚠️ 没识别出规则，试试 "规则：加法 1+1=2"';
                    addMessage('ai', response);
                    updateStats();
                    inputBox.value = '';
                    inputBox.style.height = 'auto';
                    return;
                }

                // 先尝试直接计算
                if (parsed.type === 'math' || parsed.type === 'question') {
                    const question = parsed.question || parsed.question;

                    // 1. 直接计算
                    const calcResult = calculate(question);
                    if (calcResult) {
                        addMessage('ai', `🧮 ${calcResult}`);
                        inputBox.value = '';
                        inputBox.style.height = 'auto';
                        return;
                    }

                    // 2. 从知识库推理
                    const reasonResult = reason(question);
                    if (reasonResult) {
                        addMessage('ai', reasonResult);
                        inputBox.value = '';
                        inputBox.style.height = 'auto';
                        return;
                    }

                    // 3. 上网搜索
                    isProcessing = true;
                    sendBtn.disabled = true;
                    addMessage('ai', '🌐 正在上网查...', true);
                    const lastMsg = chatArea.lastChild;
                    const bubble = lastMsg.querySelector('.bubble');

                    const searchResult = await searchWeb(question);
                    bubble.innerHTML = searchResult;

                    isProcessing = false;
                    sendBtn.disabled = false;
                    updateStats();
                    inputBox.value = '';
                    inputBox.style.height = 'auto';
                    return;
                }

                inputBox.value = '';
                inputBox.style.height = 'auto';
            }

            // ---------- 渲染消息 ----------
            function addMessage(role, content, isThinking = false) {
                if (welcome) welcome.style.display = 'none';

                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role}`;

                if (role === 'ai') {
                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    avatar.textContent = '🐻';
                    msgDiv.appendChild(avatar);
                }

                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                if (isThinking) {
                    bubble.innerHTML = '<span class="thinking">🌐 正在上网查…</span>';
                } else {
                    bubble.textContent = content;
                }

                msgDiv.appendChild(bubble);
                chatArea.appendChild(msgDiv);
                chatArea.scrollTop = chatArea.scrollHeight;

                if (role === 'user' && messageCount === 0) {
                    const short = content.length > 20 ? content.substring(0, 20) + '…' : content;
                    addHistory(short);
                }
                if (role === 'user') messageCount++;
            }

            // ---------- 历史 ----------
            function addHistory(title) {
                const placeholder = historyList.querySelector('.item[style*="cursor:default"]');
                if (placeholder) placeholder.remove();

                const item = document.createElement('div');
                item.className = 'item';
                item.textContent = title;
                item.addEventListener('click', function() {
                    clearChat();
                    document.querySelectorAll('.history .item').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                });
                historyList.prepend(item);
                historyItems.push(item);

                while (historyItems.length > 20) {
                    const old = historyItems.pop();
                    if (old.parentNode) old.parentNode.removeChild(old);
                }
            }

            // ---------- 清空 ----------
            function clearChat() {
                const messages = chatArea.querySelectorAll('.message');
                messages.forEach(el => el.remove());
                welcome.style.display = 'flex';
                messageCount = 0;
                inputBox.value = '';
                inputBox.style.height = 'auto';
                setStatus('就绪', false);
                modeLabel.textContent = '🧮 计算优先';
                inputBox.focus();
            }

            // ---------- 更新统计 ----------
            function updateStats() {
                const total = rules.length + webKnowledge.length;
                ruleBadge.textContent = `${total} 条知识`;
                memoryCount.textContent = `🧠 ${total} 条知识`;
                try {
                    localStorage.setItem('welcome_ai_data', JSON.stringify({ rules, facts, webKnowledge }));
                } catch (e) {}
            }

            // ---------- 输入框 ----------
            function autoResize() {
                inputBox.style.height = 'auto';
                inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
            }

            // ---------- 事件 ----------
            sendBtn.addEventListener('click', () => processInput(inputBox.value));
            inputBox.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    processInput(inputBox.value);
                }
            });
            inputBox.addEventListener('input', autoResize);
            newChatBtn.addEventListener('click', clearChat);

            // ---------- 启动 ----------
            window.addEventListener('load', () => {
                try {
                    const saved = localStorage.getItem('welcome_ai_data');
                    if (saved) {
                        const data = JSON.parse(saved);
                        rules = data.rules || [];
                        facts = data.facts || [];
                        webKnowledge = data.webKnowledge || [];
                        updateStats();
                    }
                } catch (e) {}
                inputBox.focus();
                console.log('🐻 Welcome AI 已启动 · 计算优先');
            });

            window.welcomeAI = { rules, facts, webKnowledge, calculate, learn: learnRule, reason, search: searchWeb };
        })();
